<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Web Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 280px;
            background: #0f172a;
            color: #f1f5f9;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .header-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #6366f1, #4338ca);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .header-icon svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }

        .header-version {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 400;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .setting-label {
            font-size: 12.5px;
            color: #cbd5e1;
        }

        .setting-desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        .footer {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #10b981;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
        </div>
        <div>
            <div class="header-title">Quick Web Translator</div>
            <div class="header-version">v1.3.0 • Pheromone</div>
        </div>
    </div>

    <div class="setting-row">
        <div>
            <div class="setting-label">Show Trigger Button</div>
            <div class="setting-desc">Icon before opening full popup</div>
        </div>
        <label class="switch">
            <input type="checkbox" id="triggerBtnToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="footer">
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Active & Ready</span>
        </div>
        <span>Target: Russian (RU)</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
